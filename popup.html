<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suno WAV Recorder</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="bar">
    <span class="brand">Suno WAV Recorder</span>
    <span class="status" id="status" role="status" aria-live="polite">Idle</span>
  </header>

  <div class="timer-row">
    <span class="timer" id="timer">0:00</span>
    <span class="meter-db" id="meter-db">no signal</span>
  </div>

  <div class="meter" id="meter" role="meter" aria-label="Recording peak level" aria-valuemin="-96" aria-valuemax="0" aria-valuenow="-96">
    <div class="meter-fill" id="meter-fill"></div>
  </div>

  <p class="readout" id="readout">Sample rate, channels and bit depth show when the WAV is written</p>

  <div class="actions">
    <button type="button" class="primary" id="start-stop" aria-describedby="hint">Start recording</button>
    <button type="button" class="ghost" id="retry" hidden>Retry save</button>
  </div>

  <p class="error" id="error" role="alert" hidden></p>
  <p class="hint" id="hint">Press Start, then play the song from the beginning.</p>
</body>
</html>
